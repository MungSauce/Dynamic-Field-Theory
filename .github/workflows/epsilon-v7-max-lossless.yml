name: Epsilon V7 maximum lossless enwik9 search

on:
  push:
    branches:
      - epsilon-v7-max-lossless-20260917
    paths:
      - 'epsilon_challenge/**'
      - '.github/workflows/epsilon-v7-max-lossless.yml'
  workflow_dispatch:

jobs:
  candidate:
    name: max-${{ matrix.family }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        family:
          - standard
          - lccp_v1
          - recursive_grammar
          - sequenced_graph
          - lightseq
          - lcg4
    steps:
      - uses: actions/checkout@v4

      - name: Install reversible workshop
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl time xz-utils zstd g++

      - name: Fetch and verify canonical enwik9
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 5 https://mattmahoney.net/dc/enwik9.zip -o enwik9.zip
          unzip -q enwik9.zip
          test "$(stat -c%s enwik9)" = "1000000000"
          echo "e206c3450ac99950df65bf70ef61a12d  enwik9" | md5sum -c -
          echo "159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc  enwik9" | sha256sum -c -

      - name: Run adaptive family search
        run: |
          python3 epsilon_challenge/max_search.py "${{ matrix.family }}" enwik9

      - name: Upload family evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epsilon-max-${{ matrix.family }}
          path: candidate_max_${{ matrix.family }}.json
          if-no-files-found: error

  select:
    name: Epsilon-incumbent-selection
    needs: candidate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all family evidence
        uses: actions/download-artifact@v4
        with:
          pattern: epsilon-max-*
          merge-multiple: true

      - name: Apply current Epsilon compression policy
        run: |
          cat epsilon_challenge/MAX_LOSSLESS_TASK.md
          python3 epsilon_challenge/max_select.py | tee EPSILON_V7_MAX_LOSSLESS_RESULT.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: epsilon-v7-max-lossless-result
          path: |
            EPSILON_V7_MAX_LOSSLESS_RESULT.json
            EPSILON_V7_MAX_LOSSLESS_RESULT.txt
            candidate_max_*.json
