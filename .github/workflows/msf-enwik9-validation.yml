name: MSF enwik9 validation

on:
  pull_request:
    paths:
      - 'validation/msf_enwik9_validate.py'
      - '.github/workflows/msf-enwik9-validation.yml'
  workflow_dispatch:

jobs:
  enwik9:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download canonical enwik9
        run: |
          curl -L --fail --retry 4 --retry-delay 5 -o enwik9.zip https://mattmahoney.net/dc/enwik9.zip
          unzip -p enwik9.zip enwik9 > enwik9
          test "$(stat -c%s enwik9)" = "1000000000"
          echo "e206c3450ac99950df65bf70ef61a12d  enwik9" | md5sum -c -
          echo "159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc  enwik9" | sha256sum -c -

      - name: Compose, delete source, listen, verify
        run: |
          python3 validation/msf_enwik9_validate.py enwik9 --report benchmark_report.json
          echo "159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc  recovered_enwik9" | sha256sum -c -

      - name: Publish measured report
        uses: actions/upload-artifact@v4
        with:
          name: msf-enwik9-benchmark-report
          path: benchmark_report.json
          if-no-files-found: error
