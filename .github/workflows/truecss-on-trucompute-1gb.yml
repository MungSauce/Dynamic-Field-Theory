name: trueCSS inside TruCompute full 1GB

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/truecss_on_trucompute_v1.cpp'
      - 'docs/TRUECSS_ON_TRUCOMPUTE_V1.md'
      - '.github/workflows/truecss-on-trucompute-1gb.yml'

jobs:
  full-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and verify canonical enwik9
        run: |
          curl -L --fail --retry 5 --retry-delay 5             -o enwik9.zip https://mattmahoney.net/dc/enwik9.zip
          python3 - <<'PY'
          import hashlib, zipfile, sys
          expected_sha="159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc"
          expected_md5="e206c3450ac99950df65bf70ef61a12d"
          with zipfile.ZipFile("enwik9.zip") as z, z.open("enwik9") as src, open("enwik9","wb") as out:
              sha=hashlib.sha256(); md5=hashlib.md5(); n=0
              while True:
                  b=src.read(8<<20)
                  if not b: break
                  out.write(b); sha.update(b); md5.update(b); n+=len(b)
          print("source_bytes="+str(n))
          print("source_sha256="+sha.hexdigest())
          print("source_md5="+md5.hexdigest())
          if n != 1_000_000_000: sys.exit("size mismatch")
          if sha.hexdigest() != expected_sha: sys.exit("sha mismatch")
          if md5.hexdigest() != expected_md5: sys.exit("md5 mismatch")
          PY

      - name: Build trueCSS on TruCompute
        run: g++ -O3 -std=c++17 experiments/truecss_on_trucompute_v1.cpp -o truecss_on_trucompute

      - name: TruCompute conformance
        run: ./truecss_on_trucompute selftest

      - name: Teach full canonical 1GB
        id: train
        run: |
          set +e
          /usr/bin/time -v ./truecss_on_trucompute train enwik9 truecss_trucompute_1gb.state 1000000000 2>&1 | tee train_1gb.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Cold replay full 1GB if frozen
        if: steps.train.outputs.rc == '0'
        run: |
          rm enwik9 enwik9.zip
          /usr/bin/time -v ./truecss_on_trucompute replay truecss_trucompute_1gb.state recovered_enwik9 2>&1 | tee replay_1gb.log
          test "$(stat -c%s recovered_enwik9)" = "1000000000"
          echo "159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc  recovered_enwik9" | sha256sum -c -

      - name: Summarize full-corpus result
        run: |
          python3 - <<'PY'
          import json, os, re
          t=open("train_1gb.log").read()
          def g(k):
              m=re.search(r"(?:^|\s)"+re.escape(k)+r"=([^\s]+)",t)
              return m.group(1) if m else None
          s=g("status")
          r={
            "name":"trueCSS on TruCompute v1.0 — canonical 1GB",
            "canonical_source_bytes":1_000_000_000,
            "canonical_source_sha256":"159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc",
            "runtime":"TruCompute",
            "physical_nodes":1_000_000,
            "graph_bytes":1_000_000,
            "page_bank_bytes":0,
            "residual_bytes":0,
            "correction_bytes":0,
            "train_status":s,
            "bytes_imprinted":int(g("bytes_imprinted") or 0),
            "failure_page":int(g("page") or 0) if s=="RELATIONAL_CONTRADICTION" else None,
            "failure_key":int(g("key") or 0) if s=="RELATIONAL_CONTRADICTION" else None,
            "failure_bit_slot":int(g("bit_slot") or 0) if s=="RELATIONAL_CONTRADICTION" else None,
            "frozen_state_bytes":int(g("frozen_state_bytes") or 0),
            "cold_replay_attempted":os.path.exists("replay_1gb.log"),
          }
          r["cold_replay_pass"]=False
          if os.path.exists("replay_1gb.log"):
              rt=open("replay_1gb.log").read()
              r["cold_replay_pass"]="status=REPLAY_PASS" in rt
          if r["cold_replay_pass"]:
              r["status"]="TRUECSS_PASS_CANDIDATE"
          elif s=="RELATIONAL_CONTRADICTION":
              r["status"]="RELATION_LAW_FALSIFIED"
          else:
              r["status"]="FAIL"
          open("truecss_on_trucompute_1gb_report.json","w").write(json.dumps(r,indent=2)+"\n")
          print(json.dumps(r,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: truecss-on-trucompute-1gb-report
          path: |
            truecss_on_trucompute_1gb_report.json
            train_1gb.log
            replay_1gb.log
          if-no-files-found: warn
