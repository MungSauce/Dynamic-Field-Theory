name: MSF recording v3.1 100MB cold replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'msf_recording_v31/**'
      - 'validation/msf_recording_v31_100mb.py'
      - '.github/workflows/msf-recording-v31-100mb.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install numeric runtime
        run: python3 -m pip install --disable-pip-version-check -q numpy
      - name: Download canonical enwik8
        run: |
          curl -L --fail --retry 4 --retry-delay 5 -o enwik8.zip https://mattmahoney.net/dc/enwik8.zip
          unzip -p enwik8.zip enwik8 > enwik100m
          test "$(stat -c%s enwik100m)" = "100000000"
          test "$(md5sum enwik100m | cut -d' ' -f1)" = "a1fa5ffddb56f4953e226637dabbb36a"
      - name: Record, erase orchestra/source, audience cold replay
        run: python3 validation/msf_recording_v31_100mb.py enwik100m
      - name: Publish measured report
        uses: actions/upload-artifact@v4
        with:
          name: msf-recording-v31-100mb-report
          path: msf_recording_v31_100mb_report.json
          if-no-files-found: error
