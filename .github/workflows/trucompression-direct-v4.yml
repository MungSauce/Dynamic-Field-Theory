name: TruCompression v4 direct-selector test

on:
  workflow_dispatch:
  push:
    paths:
      - 'trucompute/trucompute_runtime_v3.hpp'
      - 'trucompression/trucompression_direct_v4.cpp'
      - '.github/workflows/trucompression-direct-v4.yml'

jobs:
  direct-selector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build direct-selector machine
        run: g++ -O3 -std=c++17 trucompression/trucompression_direct_v4.cpp -o trucompression_v4

      - name: State and controller conformance
        run: ./trucompression_v4 selftest

      - name: Blank machine size
        run: |
          ./trucompression_v4 blank blank.truc | tee blank.log
          test "$(stat -c%s blank.truc)" = "125064"
          grep -q '^page_buttons=1000$' blank.log
          grep -q '^character_buttons=206$' blank.log
          grep -q '^control_buttons=1206$' blank.log

      - name: One-page strict 206-button mechanics test
        run: |
          ./trucompression_v4 synth 20000 compatible20k.bin
          sha256sum compatible20k.bin > compatible20k.sha256
          ./trucompression_v4 imprint compatible20k.bin compatible20k.truc | tee strict_imprint.log
          rm compatible20k.bin
          ./trucompression_v4 replay compatible20k.truc compatible20k.out --strict-buttons | tee strict_replay.log
          REC=$(sha256sum compatible20k.out | awk '{print $1}')
          SRC=$(awk '{print $1}' compatible20k.sha256)
          test "$REC" = "$SRC"
          grep -q '^control_buttons=1206$' strict_replay.log

      - name: Cross-page selector test
        run: |
          ./trucompression_v4 synth 1010000 compatible_cross_page.bin
          sha256sum compatible_cross_page.bin > cross.sha256
          ./trucompression_v4 imprint compatible_cross_page.bin cross.truc | tee cross_imprint.log
          test "$(stat -c%s cross.truc)" = "125064"
          rm compatible_cross_page.bin
          ./trucompression_v4 replay cross.truc cross.out | tee cross_replay.log
          REC=$(sha256sum cross.out | awk '{print $1}')
          SRC=$(awk '{print $1}' cross.sha256)
          test "$REC" = "$SRC"
          grep -q '^page_button=0 ' cross_replay.log
          grep -q '^page_button=1 ' cross_replay.log

      - name: Generate ordinary corpus probes
        run: |
          python3 - <<'PY'
          import random
          from pathlib import Path
          n=200_000
          Path("repeat_A.bin").write_bytes(b"A"*n)
          phrase=b"the quick brown fox jumps over the lazy dog. "
          Path("repeated_text.bin").write_bytes((phrase*((n+len(phrase)-1)//len(phrase)))[:n])
          r=random.Random(12345)
          Path("random206.bin").write_bytes(bytes(r.randrange(206) for _ in range(n)))
          PY

      - name: Measure minimum-width direct transfer failures
        run: |
          : > direct_selector_summary.txt
          for src in repeat_A.bin repeated_text.bin random206.bin; do
            art="${src%.bin}.truc"
            log="${src%.bin}.log"
            set +e
            ./trucompression_v4 imprint "$src" "$art" > "$log"
            rc=$?
            set -e
            echo "=== $src rc=$rc ===" | tee -a direct_selector_summary.txt
            cat "$log" | tee -a direct_selector_summary.txt
            if [ "$rc" = "0" ]; then
              echo "UNEXPECTED_FIT=$src" | tee -a direct_selector_summary.txt
              test "$(stat -c%s "$art")" = "125064"
            else
              test "$rc" = "2"
              grep -q '^status=IMPRINT_CONTRADICTION$' "$log"
              grep -q '^node_to_node_relations=0$' "$log"
              grep -q '^machine_growth=0$' "$log"
              test ! -e "$art"
            fi
          done

      - name: Preserve evidence
        uses: actions/upload-artifact@v4
        with:
          name: trucompression-v4-direct-selector-results
          path: |
            blank.log
            strict_imprint.log
            strict_replay.log
            cross_imprint.log
            cross_replay.log
            direct_selector_summary.txt
