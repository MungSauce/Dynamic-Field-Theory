name: TruCompression v3 four-condition conformance

on:
  workflow_dispatch:
  push:
    paths:
      - 'trucompute/trucompute_runtime_v3.hpp'
      - 'trucompression/trucompression_native_v3.cpp'
      - 'docs/TRUCOMPUTE_FOUR_CONDITION_STATE_LAW_v2.0.md'
      - 'docs/TRUCOMPRESSION_FORMAL_REPLICATION_PROTOCOL_v1.1.md'

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build corrected machine
        run: |
          g++ -O3 -std=c++17 trucompression/trucompression_native_v3.cpp -o trucompression_v3
        shell: bash

      - name: Four-condition self-test
        run: ./trucompression_v3 selftest

      - name: Generate deterministic prefixes
        run: |
          python3 - <<'PY'
          import random
          from pathlib import Path
          for n in (50_000, 70_000):
              r = random.Random(12345)
              Path(f"prefix{n}.bin").write_bytes(bytes(r.randrange(256) for _ in range(n)))
          PY

      - name: 50K freeze and strict replay
        run: |
          sha256sum prefix50000.bin > source.sha256
          ./trucompression_v3 imprint prefix50000.bin machine.truc
          test "$(stat -c%s machine.truc)" = "125064"
          rm prefix50000.bin
          ./trucompression_v3 replay machine.truc recovered.bin --strict-buttons
          REC=$(sha256sum recovered.bin | awk '{print $1}')
          SRC=$(awk '{print $1}' source.sha256)
          test "$REC" = "$SRC"

      - name: v1 routing law still fails without growth
        run: |
          set +e
          ./trucompression_v3 imprint prefix70000.bin no_artifact.truc > contradiction.log
          RC=$?
          set -e
          cat contradiction.log
          test "$RC" = "2"
          grep -q '^status=IMPRINT_CONTRADICTION$' contradiction.log
          grep -q '^machine_growth=0$' contradiction.log
          test ! -e no_artifact.truc
