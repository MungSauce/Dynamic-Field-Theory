name: trueCSS 3bit zero-field 100MB applicability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/truecss_3bit_zero_v2.cpp'
      - 'docs/TRUECSS_3BIT_ZERO_V2.md'
      - '.github/workflows/truecss-3bit-zero-100mb.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch canonical enwik9 100MB prefix
        run: |
          curl -L --fail --retry 4 --retry-delay 5 -o enwik9.zip https://mattmahoney.net/dc/enwik9.zip
          python3 - <<'PY'
          import hashlib,zipfile
          with zipfile.ZipFile('enwik9.zip') as z,z.open('enwik9') as src,open('enwik100m','wb') as out:
              left=100_000_000;h=hashlib.sha256()
              while left:
                  b=src.read(min(8<<20,left))
                  if not b:raise SystemExit("unexpected EOF")
                  out.write(b);h.update(b);left-=len(b)
          print("source_sha256="+h.hexdigest())
          PY

      - name: Build zero-field signed-binary probe
        run: g++ -O3 -std=c++17 experiments/truecss_3bit_zero_v2.cpp -o truecss_3bit_zero

      - name: Teach fixed zero field
        id: train
        run: |
          set +e
          ./truecss_3bit_zero train enwik100m truecss_3bit_zero.state 100000000 | tee train.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Cold replay if substrate survives
        if: steps.train.outputs.rc == '0'
        run: |
          rm enwik100m
          ./truecss_3bit_zero replay truecss_3bit_zero.state recovered.bin | tee replay.log
          test "$(stat -c%s recovered.bin)" = "100000000"

      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os,re
          t=open("train.log").read()
          def g(k):
              m=re.search(r"(?:^|\s)"+re.escape(k)+r"=([^\s]+)",t)
              return m.group(1) if m else None
          s=g("status")
          r={
            "name":"trueCSS 3bit V2 zero-field signed binary",
            "source_bytes_requested":100_000_000,
            "physical_nodes":1_000_000,
            "node_states":[-1,0,1],
            "zero_field":True,
            "logical_encoding":{"0":"(-1,+1)","1":"(+1,-1)"},
            "bits_per_terminal":8,
            "page_bank_bytes":0,
            "residual_bytes":0,
            "correction_bytes":0,
            "optimization_target":"node/state algebra only",
            "train_status":s,
            "bytes_imprinted":int(g("bytes_imprinted") or 0),
            "failure_page":int(g("page") or 0) if s=="RELATIONAL_CONTRADICTION" else None,
            "failure_key":int(g("key") or 0) if s=="RELATIONAL_CONTRADICTION" else None,
            "failure_bit_slot":int(g("bit_slot") or 0) if s=="RELATIONAL_CONTRADICTION" else None,
            "active_nodes":int(g("active_nodes") or 0),
            "neutral_nodes":int(g("neutral_nodes") or 0),
            "frozen_state_bytes":int(g("frozen_state_bytes") or 0),
            "cold_replay_attempted":os.path.exists("replay.log"),
          }
          r["cold_replay_pass"]=False
          if os.path.exists("replay.log"):
              rt=open("replay.log").read();r["cold_replay_pass"]="status=REPLAY_PASS" in rt
          r["status"]="PASS" if r["cold_replay_pass"] else ("RELATION_LAW_FALSIFIED" if s=="RELATIONAL_CONTRADICTION" else "FAIL")
          open("truecss_3bit_zero_100mb_report.json","w").write(json.dumps(r,indent=2)+"\n")
          print(json.dumps(r,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: truecss-3bit-zero-100mb-report
          path: |
            truecss_3bit_zero_100mb_report.json
            train.log
            replay.log
          if-no-files-found: warn
