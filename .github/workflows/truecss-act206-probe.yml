name: trueCSS ACT206 canonical probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/truecss_act206_probe.cpp'
      - 'experiments/truecss_act206_v2_probe.cpp'
      - '.github/workflows/truecss-act206-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and verify canonical enwik9
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 3 -o enwik9.zip https://www.mattmahoney.net/dc/enwik9.zip
          unzip -q enwik9.zip
          test "$(stat -c%s enwik9)" = "1000000000"
          echo "e206c3450ac99950df65bf70ef61a12d  enwik9" | md5sum -c -
          echo "159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc  enwik9" | sha256sum -c -

      - name: Build V1 and V2
        run: |
          g++ -O3 -std=c++20 experiments/truecss_act206_probe.cpp -o truecss_act206_v1
          g++ -O3 -std=c++20 experiments/truecss_act206_v2_probe.cpp -o truecss_act206_v2

      - name: Run 50 MB ACT206 V1 and V2 laws
        run: |
          set +e
          : > act206_results.txt
          for law in count page_recursive context_recursive; do
            echo "=== V1 $law ===" | tee -a act206_results.txt
            /usr/bin/time -v ./truecss_act206_v1 enwik9 "$law" >> act206_results.txt 2>&1
            echo "exit_code=$?" >> act206_results.txt
          done
          for law in count_affine page_affine context_affine; do
            echo "=== V2 $law ===" | tee -a act206_results.txt
            /usr/bin/time -v ./truecss_act206_v2 enwik9 "$law" >> act206_results.txt 2>&1
            echo "exit_code=$?" >> act206_results.txt
          done
          cat act206_results.txt
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: act206-results
          path: act206_results.txt
