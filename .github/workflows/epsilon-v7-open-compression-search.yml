name: Epsilon V7 open enwik9 compression search

on:
  push:
    branches:
      - epsilon-v7-enwik9-execution-20260917
    paths:
      - 'epsilon_challenge/**'
      - '.github/workflows/epsilon-v7-open-compression-search.yml'
  workflow_dispatch:

jobs:
  candidate:
    name: candidate-${{ matrix.family }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        family:
          - standard
          - lccp_v1
          - recursive_grammar
          - sequenced_graph
          - lightseq
          - lcg4
    steps:
      - uses: actions/checkout@v4

      - name: Install reversible workshop dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl time xz-utils zstd g++

      - name: Fetch and verify canonical enwik9
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 5 https://mattmahoney.net/dc/enwik9.zip -o enwik9.zip
          unzip -q enwik9.zip
          test "$(stat -c%s enwik9)" = "1000000000"
          echo "e206c3450ac99950df65bf70ef61a12d  enwik9" | md5sum -c -
          echo "159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc  enwik9" | sha256sum -c -

      - name: Run disposable reversible family
        run: |
          python3 epsilon_challenge/run_candidate.py "${{ matrix.family }}" enwik9

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epsilon-candidate-${{ matrix.family }}
          path: candidate_${{ matrix.family }}.json
          if-no-files-found: error

  select:
    name: Epsilon-select-smallest-exact
    needs: candidate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all candidate evidence
        uses: actions/download-artifact@v4
        with:
          pattern: epsilon-candidate-*
          merge-multiple: true

      - name: Apply preserved Epsilon compression decision policy
        run: |
          sha256sum epsilon_challenge/EPSILON_V7_COMPRESSION_MECHANICS.tsv
          python3 epsilon_challenge/select_result.py | tee EPSILON_V7_ENWIK9_OPEN_RESULT.txt

      - name: Upload final Epsilon result
        uses: actions/upload-artifact@v4
        with:
          name: epsilon-v7-enwik9-open-result
          path: |
            EPSILON_V7_ENWIK9_OPEN_RESULT.json
            EPSILON_V7_ENWIK9_OPEN_RESULT.txt
            candidate_*.json
