name: TruCompression v7 enwik9 dormant artifact

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/trucompression-v7-enwik9.yml'

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install dependency
        run: sudo apt-get update -qq && sudo apt-get install -y zlib1g-dev

      - name: Build v7
        run: g++ -O3 -std=c++17 trucompression/trucompression_hmc_v7.cpp -lz -o trucompression_v7

      - name: Download canonical enwik9
        run: |
          curl -L --fail --retry 5 --retry-delay 5 -o enwik9.zip https://mattmahoney.net/dc/enwik9.zip
          unzip -q enwik9.zip
          test "$(stat -c%s enwik9)" = "1000000000"
          test "$(md5sum enwik9 | awk '{print $1}')" = "e206c3450ac99950df65bf70ef61a12d"

      - name: Freeze single dormant imprint
        run: |
          ./trucompression_v7 freeze enwik9 enwik9.truc | tee freeze.log
          stat -c 'measured_artifact_bytes=%s' enwik9.truc | tee artifact_size.log
          sha256sum enwik9.truc | tee artifact.sha256
          grep -q '^persistent_selector_configurations=0$' freeze.log
          grep -q '^persistent_page_banks=0$' freeze.log
          grep -q '^persistent_node_response_tables=0$' freeze.log

      - name: Remove source
        run: |
          rm -f enwik9 enwik9.zip
          test ! -e enwik9
          test ! -e enwik9.zip

      - name: Replay from dormant artifact only
        run: |
          ./trucompression_v7 replay enwik9.truc enwik9.recovered | tee replay.log
          test "$(stat -c%s enwik9.recovered)" = "1000000000"
          test "$(md5sum enwik9.recovered | awk '{print $1}')" = "e206c3450ac99950df65bf70ef61a12d"
          artifact=$(stat -c%s enwik9.truc)
          echo "source_bytes=1000000000" | tee result.log
          echo "artifact_bytes=$artifact" | tee -a result.log
          echo "artifact_sha256=$(sha256sum enwik9.truc | awk '{print $1}')" | tee -a result.log
          echo "recovered_md5=$(md5sum enwik9.recovered | awk '{print $1}')" | tee -a result.log
          python3 - "$artifact" <<'PY' | tee -a result.log
          import sys
          source=1_000_000_000
          artifact=int(sys.argv[1])
          print(f"artifact_over_source={artifact/source:.9f}")
          print(f"source_over_artifact={source/artifact:.9f}")
          print(f"saved_bytes={source-artifact}")
          print(f"reduction_percent={(1-artifact/source)*100:.7f}")
          PY
          grep -q '^status=SOURCE_ISOLATED_REPLAY_PASS$' replay.log

      - name: Preserve compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trucompression-v7-enwik9-dormant-result
          path: |
            freeze.log
            artifact_size.log
            artifact.sha256
            replay.log
            result.log
