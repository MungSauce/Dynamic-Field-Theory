name: TruCompute native resistor field v11

on:
  workflow_dispatch:
  push:
    paths:
      - 'trucompute/trucompute_native_resistor_v11.hpp'
      - 'experiments/trucompute_native_resistor_v11_test.cpp'
      - 'docs/TRUCOMPUTE_NATIVE_RESISTOR_FIELD_v11.0.md'
      - '.github/workflows/trucompute-native-resistor-v11.yml'

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: g++ -O3 -std=c++17 experiments/trucompute_native_resistor_v11_test.cpp -o resistor_v11

      - name: Native resistor conformance
        run: |
          ./resistor_v11 selftest | tee selftest.log
          grep -q '^TRUCOMPUTE_NATIVE_RESISTOR_V11=PASS$' selftest.log
          grep -q '^native_domain=NEG_BOTH_POS$' selftest.log
          grep -q '^machine_off_state=false$' selftest.log
          grep -q '^reset_between_probes=false$' selftest.log
          grep -q '^node_native_primitive=CONDITION_SENSITIVE_RESISTOR$' selftest.log
          grep -q '^page_response_table=false$' selftest.log
          grep -q '^character_response_table=false$' selftest.log
          grep -q '^fixed_imprint_channels=8$' selftest.log

      - name: Build representable four-page and eight-page sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          POS=64
          def source(pages):
              out=[]
              for q in range(pages):
                  for pos in range(POS):
                      value=(pos%100)+((pos%7)+1)*q
                      assert value<206
                      out.append(value)
              return bytes(out)
          Path("source4.bin").write_bytes(source(4))
          Path("source8.bin").write_bytes(source(8))
          PY
          sha256sum source4.bin > source4.sha
          sha256sum source8.bin > source8.sha

      - name: Freeze four-page field
        run: |
          ./resistor_v11 freeze source4.bin field4.tru | tee freeze4.log
          grep -q '^status=NATIVE_RESISTOR_FIELD_FROZEN$' freeze4.log
          grep -q '^page_response_table=false$' freeze4.log
          grep -q '^character_response_table=false$' freeze4.log
          grep -q '^residual_bytes=0$' freeze4.log

      - name: Freeze eight-page field without storage growth
        run: |
          ./resistor_v11 freeze source8.bin field8.tru | tee freeze8.log
          grep -q '^status=NATIVE_RESISTOR_FIELD_FROZEN$' freeze8.log
          grep -q '^pages=8$' freeze8.log
          test "$(stat -c%s field4.tru)" = "$(stat -c%s field8.tru)"
          echo "artifact_size_independent_of_page_count=PASS" | tee fixed_size.log

      - name: Delete sources and cold replay
        run: |
          rm source4.bin source8.bin
          test ! -e source4.bin
          test ! -e source8.bin
          ./resistor_v11 replay field4.tru recovered4.bin | tee replay4.log
          ./resistor_v11 replay field8.tru recovered8.bin | tee replay8.log
          test "$(sha256sum recovered4.bin | awk '{print $1}')" = "$(awk '{print $1}' source4.sha)"
          test "$(sha256sum recovered8.bin | awk '{print $1}')" = "$(awk '{print $1}' source8.sha)"
          grep -q '^status=NATIVE_RESISTOR_EXACT_REPLAY_PASS$' replay4.log
          grep -q '^status=NATIVE_RESISTOR_EXACT_REPLAY_PASS$' replay8.log
          grep -q '^machine_off_state=false$' replay8.log
          grep -q '^reset_between_probes=false$' replay8.log

      - name: Prove fixed capacity fails instead of growing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          POS=64
          out=[]
          for q in range(9):
              for pos in range(POS):
                  value=(pos%100)+((pos%7)+1)*q
                  if q==8 and pos==0:
                      value+=1
                  assert value<206
                  out.append(value)
          Path("source9_fail.bin").write_bytes(bytes(out))
          PY
          set +e
          ./resistor_v11 freeze source9_fail.bin should_not_exist.tru > capacity.log 2>&1
          rc=$?
          set -e
          cat capacity.log
          test "$rc" = "2"
          grep -q '^status=CAPACITY_EXCEEDED' capacity.log
          grep -q 'artifact_created=false' capacity.log
          test ! -e should_not_exist.tru

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trucompute-native-resistor-v11
          path: |
            selftest.log
            freeze4.log
            freeze8.log
            replay4.log
            replay8.log
            fixed_size.log
            capacity.log
            source4.sha
            source8.sha
