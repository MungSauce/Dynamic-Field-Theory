name: trueCSS 3bit live-zero graph 100MB

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/truecss_3bit_graph_v3.cpp'
      - 'docs/TRUECSS_3BIT_GRAPH_V3.md'
      - '.github/workflows/truecss-3bit-graph-100mb.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch canonical enwik9 100MB prefix
        run: |
          curl -L --fail --retry 4 --retry-delay 5 -o enwik9.zip https://mattmahoney.net/dc/enwik9.zip
          python3 - <<'PY'
          import hashlib,zipfile
          with zipfile.ZipFile('enwik9.zip') as z,z.open('enwik9') as src,open('enwik100m','wb') as out:
              left=100_000_000;h=hashlib.sha256()
              while left:
                  b=src.read(min(8<<20,left))
                  if not b:raise SystemExit("unexpected EOF")
                  out.write(b);h.update(b);left-=len(b)
          print("source_sha256="+h.hexdigest())
          PY
      - name: Build
        run: g++ -O3 -std=c++17 experiments/truecss_3bit_graph_v3.cpp -o truecss_3bit_graph
      - name: Teach fixed graph
        id: train
        run: |
          set +e
          ./truecss_3bit_graph train enwik100m truecss_3bit_graph.state 100000000 | tee train.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Cold replay if graph survives
        if: steps.train.outputs.rc == '0'
        run: |
          rm enwik100m
          ./truecss_3bit_graph replay truecss_3bit_graph.state recovered.bin | tee replay.log
          test "$(stat -c%s recovered.bin)" = "100000000"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os,re
          t=open("train.log").read()
          def g(k):
              m=re.search(r"(?:^|\s)"+re.escape(k)+r"=([^\s]+)",t)
              return m.group(1) if m else None
          s=g("status")
          r={
            "name":"trueCSS 3bit V3 graph-weighted live zero",
            "source_bytes_requested":100_000_000,
            "physical_nodes":1_000_000,
            "fixed_edges_per_node":4,
            "node_width_bytes":1,
            "edge_weight_states":[-1,0,1],
            "dead_zero":"(0,0), activity=0",
            "live_zero_A":"(+1,-1), activity=2",
            "live_zero_B":"(-1,+1), activity=2",
            "train_status":s,
            "bytes_imprinted":int(g("bytes_imprinted") or 0),
            "failure_page":int(g("page") or 0) if s=="RELATIONAL_CONTRADICTION" else None,
            "failure_key":int(g("key") or 0) if s=="RELATIONAL_CONTRADICTION" else None,
            "failure_bit_slot":int(g("bit_slot") or 0) if s=="RELATIONAL_CONTRADICTION" else None,
            "active_edge_weights":int(g("active_edge_weights") or 0),
            "dead_edge_weights":int(g("dead_edge_weights") or 0),
            "frozen_state_bytes":int(g("frozen_state_bytes") or 0),
            "cold_replay_attempted":os.path.exists("replay.log"),
          }
          r["cold_replay_pass"]=False
          if os.path.exists("replay.log"):
              r["cold_replay_pass"]="status=REPLAY_PASS" in open("replay.log").read()
          r["status"]="PASS" if r["cold_replay_pass"] else ("RELATION_LAW_FALSIFIED" if s=="RELATIONAL_CONTRADICTION" else "FAIL")
          open("truecss_3bit_graph_100mb_report.json","w").write(json.dumps(r,indent=2)+"\n")
          print(json.dumps(r,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: truecss-3bit-graph-100mb-report
          path: |
            truecss_3bit_graph_100mb_report.json
            train.log
            replay.log
          if-no-files-found: warn
