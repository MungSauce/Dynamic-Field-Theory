name: Full Module1 seed Sphere pass
on:
  pull_request:
    paths:
      - '.github/workflows/module1-enwik9.yml'
jobs:
  sphere:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Construct three exact Sphereite projections of full ordered Module1 seed
        run: |
          curl -L --fail --retry 5 --retry-delay 5 -o enwik9.zip https://mattmahoney.net/dc/enwik9.zip
          python3 - <<'PY'
          import zipfile,hashlib,json,tempfile,os,shutil
          EXPECT="159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc"
          with zipfile.ZipFile("enwik9.zip") as z:
            src=z.read("enwik9")
          assert len(src)==1_000_000_000 and hashlib.sha256(src).hexdigest()==EXPECT
          alphabet=sorted(set(src)); assert len(alphabet)==206
          beta={b:i+1 for i,b in enumerate(alphabet)}
          inv={i+1:b for i,b in enumerate(alphabet)}
          # Sphereite A: exact ordered decimal-token stream, streamed to disk.
          p="seed.bin"; h=hashlib.sha256(); digits=0
          with open(p,"wb") as o:
            first=True
            for off in range(0,len(src),1_000_000):
              buf=bytearray()
              for x in src[off:off+1_000_000]:
                if not first: buf+=b"207"
                buf+=str(beta[x]).encode(); first=False
              o.write(buf);h.update(buf);digits+=len(buf)
          # Sphereite B: same full object projected as exact token labels (1 byte each);
          # separator/order is implicit in the fixed projection, not discarded.
          labels=bytes(beta[x] for x in src)
          bh=hashlib.sha256(labels).hexdigest()
          # Sphereite C: exact ordinal-delta projection over labels.
          # first label + signed deltas encoded as fixed int16 little-endian.
          import array
          deltas=array.array("h")
          prev=0
          for i,x in enumerate(labels):
            if i==0: deltas.append(x)
            else: deltas.append(x-prev)
            prev=x
          if os.sys.byteorder!="little": deltas.byteswap()
          ch=hashlib.sha256(deltas.tobytes()).hexdigest()
          # Reconstruct source independently from B and C.
          rb=bytes(inv[x] for x in labels)
          assert hashlib.sha256(rb).hexdigest()==EXPECT
          vals=array.array("h"); vals.frombytes(deltas.tobytes())
          if os.sys.byteorder!="little": vals.byteswap()
          cur=0; rec=bytearray(len(vals))
          for i,d in enumerate(vals):
            cur=d if i==0 else cur+d
            assert 1<=cur<=206
            rec[i]=inv[cur]
          assert hashlib.sha256(rec).hexdigest()==EXPECT
          report={"source_sha256":EXPECT,"module1_seed_digits":digits,"module1_seed_sha256":h.hexdigest(),
            "sphereite_A":{"representation":"ordered decimal Module1 seed","bytes":os.path.getsize(p)},
            "sphereite_B":{"representation":"ordered label projection","bytes":len(labels),"sha256":bh},
            "sphereite_C":{"representation":"signed ordinal-delta projection","bytes":len(deltas)*2,"sha256":ch},
            "B_exact_source_reconstruction":True,"C_exact_source_reconstruction":True,
            "common_invariant":"ordered 1..206 label trajectory under fixed Module1 mapping",
            "smallest_exact_projection_bytes":len(labels),
            "reduction_vs_literal_seed_percent":100*(1-len(labels)/digits)}
          print(json.dumps(report,indent=2));open("sphere_report.json","w").write(json.dumps(report,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full-seed-sphere-report
          path: sphere_report.json
