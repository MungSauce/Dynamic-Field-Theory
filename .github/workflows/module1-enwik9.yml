name: Module1 zero-separator symbolic Sphere
on:
  pull_request:
    paths:
      - '.github/workflows/module1-enwik9.yml'
jobs:
  sphere:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Module1 zero separator and symbolic Sphere math
        run: |
          curl -L --fail --retry 5 --retry-delay 5 -o enwik9.zip https://mattmahoney.net/dc/enwik9.zip
          python3 - <<'PY'
          import zipfile,hashlib,json
          EXPECT="159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc"
          with zipfile.ZipFile("enwik9.zip") as z:
            f=z.open("enwik9"); h=hashlib.sha256(); counts=[0]*256; seen=set(); n=0
            while True:
              b=f.read(8<<20)
              if not b: break
              h.update(b); n+=len(b)
              for x in b: counts[x]+=1; seen.add(x)
          assert n==1_000_000_000 and h.hexdigest()==EXPECT and len(seen)==206
          alphabet=sorted(seen); beta={b:i+1 for i,b in enumerate(alphabet)}
          label_digits=sum(counts[b]*len(str(beta[b])) for b in alphabet)
          seed_digits=label_digits+(n-1) # separator 0 = one digit
          # Mathematical Sphere: the full ordered numerical seed N is the operand;
          # do not expand N into a second physical representation.
          sphere={"V":"N (full ordered Module1 zero-separated numerical seed)",
                  "E":"ordinal adjacency / separator-delimited label relations",
                  "H":"recursive relations over the ordered trajectory",
                  "C":["labels 1..206","separator 0","exact order","fixed ascending-byte mapping"],
                  "F":"recursively accessible sub-trajectories"}
          report={"source_bytes":n,"source_sha256":h.hexdigest(),"distinct_symbols":206,
                  "separator":0,"label_digits":label_digits,"module1_seed_digits":seed_digits,
                  "sphere":sphere,"sphere_construction":"symbolic_exact_operand","physical_sphere_expansion_bytes":0}
          print(json.dumps(report,indent=2));open("zero_separator_sphere_report.json","w").write(json.dumps(report,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zero-separator-symbolic-sphere-report
          path: zero_separator_sphere_report.json
