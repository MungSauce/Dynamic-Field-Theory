name: MSF modifier-bank 100MB scaling validation

on:
  pull_request:
    paths:
      - 'msf_modbank/**'
      - 'validation/msf_modbank_scale_100mb.py'
      - '.github/workflows/msf-modbank-scale-100mb.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Download canonical enwik9 and extract first 100MB
        run: |
          curl -L --fail --retry 4 --retry-delay 5 -o enwik9.zip https://mattmahoney.net/dc/enwik9.zip
          python3 - <<'PY'
          import hashlib, zipfile
          with zipfile.ZipFile('enwik9.zip') as z, z.open('enwik9') as src, open('enwik100m','wb') as out:
              left=100_000_000; h=hashlib.sha256()
              while left:
                  b=src.read(min(8<<20,left))
                  if not b: raise SystemExit('unexpected EOF')
                  out.write(b); h.update(b); left-=len(b)
          print('prefix_sha256='+h.hexdigest())
          PY
          test "$(stat -c%s enwik100m)" = "100000000"

      - name: Sweep 32 to 512 instruments with cold replay
        run: python3 validation/msf_modbank_scale_100mb.py enwik100m

      - name: Publish scale report
        uses: actions/upload-artifact@v4
        with:
          name: msf-modbank-100mb-scale-report
          path: msf_modbank_100mb_scale_report.json
          if-no-files-found: error
