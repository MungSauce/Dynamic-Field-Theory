name: MSF modifier-bank parallel 100MB validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'msf_modbank/**'
      - 'validation/msf_modbank_one_100mb.py'
      - '.github/workflows/msf-modbank-parallel-100mb.yml'

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        instruments: [32, 64, 128, 256, 512]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download canonical enwik9 and extract first 100MB
        run: |
          curl -L --fail --retry 4 --retry-delay 5 -o enwik9.zip https://mattmahoney.net/dc/enwik9.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('enwik9.zip') as z, z.open('enwik9') as src, open('enwik100m','wb') as out:
              left=100_000_000
              while left:
                  b=src.read(min(8<<20,left))
                  if not b: raise SystemExit('unexpected EOF')
                  out.write(b); left-=len(b)
          PY
          test "$(stat -c%s enwik100m)" = "100000000"

      - name: Compose, erase source, listen, verify
        run: python3 validation/msf_modbank_one_100mb.py enwik100m ${{ matrix.instruments }}

      - name: Publish report
        uses: actions/upload-artifact@v4
        with:
          name: msf-modbank-N${{ matrix.instruments }}-report
          path: msf_modbank_N${{ matrix.instruments }}_report.json
          if-no-files-found: error
